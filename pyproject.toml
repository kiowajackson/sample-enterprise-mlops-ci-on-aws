[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-mlops-ci"
version = "0.1.0"
description = "Shared SageMaker pipelines using an existing image and supplied source"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.15.3",
    "botocore==1.38.36",
    "setuptools==74.1.3",
    "shap==0.49.1",
    "xgboost==3.4.1",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "joblib==1.5.3",
    "boto3==1.38.36",
    "flask==3.1.2",
    "gunicorn==23.0.0",
]

[project.optional-dependencies]
checks = ["PyYAML==6.0.3", "IPython==9.12.0"]
autogluon = ["autogluon.tabular==1.2", "typing_extensions==4.16.0"]
pytorch = ["torch==2.12.1"]

[tool.setuptools.packages.find]
where = ["mlops-models/src", "mlops-features"]

[tool.setuptools.package-data]
mlops_models = [
    "model_base/requirements*.txt",
    "model_base/*/definition.json",
    "models/*/parameters.json",
    "models/*/model_metadata.json",
    "models/*/requirements*.txt",
    "models/*/*/definition.json",
]

[dependency-groups]
build = ["setuptools==80.9.0", "wheel==0.45.1"]
